name: Release

# When a pull request is merged into `main`, build and push the backend and
# frontend container images to GHCR (tagged with the merge commit SHA), then
# open or update a stacked deploy PR per environment on the config repository.

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sbillion/medical-appointment

jobs:
  # ----------------------------------------------------------------------- #
  # Build & push both images, tagged with the merge commit SHA.
  # ----------------------------------------------------------------------- #
  build-and-push:
    name: Build & push (${{ matrix.service }})
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: sha
        run: |
          TAG="${{ github.event.pull_request.merge_commit_sha }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short=${TAG::10}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ steps.sha.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.tag }}

  # ----------------------------------------------------------------------- #
  # Open / update stacked deploy PRs on the config repository.
  # ----------------------------------------------------------------------- #
  config-prs:
    name: Open config deploy PRs
    if: github.event.pull_request.merged == true
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      CONFIG_REPO: SBillion/medical-appointment-config
      IMAGE_TAG: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config-repo
          fetch-depth: 0

      - name: Import GPG signing key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Resolve merge commit SHA
        id: sha
        run: |
          TAG="${{ github.event.pull_request.merge_commit_sha }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Open / update development deploy PR
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          python3 .github/scripts/open_config_pr.py \
            --repo config-repo \
            --config-full "${{ env.CONFIG_REPO }}" \
            --app-full "${{ github.repository }}" \
            --env development \
            --base main \
            --pending deploy/development-pending \
            --values envs/development/values.yaml \
            --label deploy/development \
            --image-tag "${{ steps.sha.outputs.tag }}" \
            --app-pr-number "${{ github.event.pull_request.number }}" \
            --app-pr-title "${{ github.event.pull_request.title }}" \
            --app-pr-url "${{ github.event.pull_request.html_url }}" \
            --auto-merge

      - name: Open / update production deploy PR
        env:
          GH_TOKEN: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          python3 .github/scripts/open_config_pr.py \
            --repo config-repo \
            --config-full "${{ env.CONFIG_REPO }}" \
            --app-full "${{ github.repository }}" \
            --env production \
            --base main \
            --pending deploy/production-pending \
            --values envs/production/values.yaml \
            --label deploy/production \
            --image-tag "${{ steps.sha.outputs.tag }}" \
            --app-pr-number "${{ github.event.pull_request.number }}" \
            --app-pr-title "${{ github.event.pull_request.title }}" \
            --app-pr-url "${{ github.event.pull_request.html_url }}"
